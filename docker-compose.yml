name: timing

services:
  db:
    image: postgres:16
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-timing}
      POSTGRES_USER: ${POSTGRES_USER:-timing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timing -d timing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  web:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      RUN_MIGRATIONS: "0"
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  media_data:
